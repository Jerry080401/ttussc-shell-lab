# 裝成 /etc/systemd/system/incus.service.d/shell-lab-firewall.conf。
# 隔離防火牆的表不在時 Incus 不會啟動，VM 就不會在沒有隔離的情況下開機。
# 用 Wants 而不是 Requires：重新載入防火牆時不會連帶重啟 Incus。
[Unit]
Wants=shell-lab-firewall.service
After=shell-lab-firewall.service

[Service]
ExecStartPre=/bin/sh -c '/usr/sbin/nft list table inet shell_lab >/dev/null'
