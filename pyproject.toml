[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ttussc-shell-lab"
version = "1.0.0"
description = "一人一台 Linux VM 的命令列課程環境，學生用 NetBird 連線"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"

[project.scripts]
labctl = "labctl.cli:main"

[tool.setuptools]
packages = ["labctl", "labctl.labs"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# 中文的全形標點不是打錯字。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# 題目的說明文字是給學生看的內容，照段落換行，不照程式碼的行寬。
"labctl/labs/*.py" = ["E501"]
